name: V2.3.1 Exact Source Sync

on:
  push:
    branches:
      - feature/v2.3.1-workflow-alerts

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified V2.3.1 patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://too-saturday-pat-longitude.trycloudflare.com/v231.patch' \
            -o /tmp/v231.patch
          echo '4d27275b20647916c1ecea56bb4dd0f8a60d9978ed8fde04d3f95997f76473ed  /tmp/v231.patch' | sha256sum -c -
          git rm .github/workflows/v231-sync.yml
          git apply --index /tmp/v231.patch
          actual_tree="$(git write-tree)"
          expected_tree='947cf42372b39e9d912ff7c0c6c082c33c2252f5'
          echo "Actual tree:   ${actual_tree}"
          echo "Expected tree: ${expected_tree}"
          test "${actual_tree}" = "${expected_tree}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add V2.3.1 workflow alerts and role-scoped work queue'
          git push origin HEAD:feature/v2.3.1-workflow-alerts
