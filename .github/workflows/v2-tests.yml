name: Huyen Vu Van Ban AI V2 Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/huyen-vu-van-ban-ai-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VBHC_SESSION_SECRET: test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      VBHC_DEV_DB: /tmp/huyenvu-vbai-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install starlette uvicorn python-docx pypdf
      - name: Compile Python
        run: python -m compileall -q webapp scripts
      - name: Import full web server
        run: python -c "from webapp.server import app; print('routes=', len(app.routes))"
      - name: Run regression tests
        run: python -m unittest discover -s webapp/tests -v
