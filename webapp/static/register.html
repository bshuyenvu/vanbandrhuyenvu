<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sổ Văn Bản Điện Tử • Huyền Vũ Văn Bản AI</title><style>
:root{--navy:#17263b;--red:#a51f2d;--bg:#f3f6f9;--line:#dce4ed;--muted:#708095;--green:#087a55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:"Segoe UI",Roboto,Arial,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:19px}.wrap{max-width:1480px;margin:auto;padding:22px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 7px 20px #17263b0a}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:space-between}.left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field,.btn{border:1px solid #d5deea;background:#fff;border-radius:8px;padding:9px 11px;font:inherit}.field{min-width:180px}.search{min-width:330px}.btn{cursor:pointer;font-weight:600}.btn.primary{background:#4338ca;border-color:#4338ca;color:#fff}.small{font-size:12px;color:var(--muted)}h1{font-size:27px;margin:0}.tablewrap{overflow:auto;margin-top:14px}.table{border-collapse:collapse;width:100%;font-size:13px;min-width:1200px}.table th,.table td{border-bottom:1px solid #edf1f5;text-align:left;padding:10px 9px;vertical-align:top}.table th{font-size:11px;color:#617086;background:#f8fafc;position:sticky;top:0}.badge{display:inline-block;border-radius:18px;padding:4px 8px;background:#eef2ff;font-size:11px}.urgent{color:#b42336;font-weight:700}.empty{text-align:center;color:var(--muted);padding:35px}.stats{display:flex;gap:18px;margin:12px 0}.metric b{font-size:22px}.metric span{display:block;font-size:11px;color:var(--muted)}@media(max-width:720px){.wrap{padding:12px}.search{min-width:100%}.top{padding:12px}.toolbar{align-items:stretch}.left{width:100%}.field{flex:1}}</style></head><body>
<header class="top"><div class="brand">▤ SỔ VĂN BẢN ĐIỆN TỬ<div class="small">Huyền Vũ Văn Bản AI • Tra cứu hồ sơ tiếp nhận</div></div><div><button class="btn" onclick="location.href='/'">← Tổng quan</button> <button class="btn primary" onclick="location.href='/digitize'">✦ Quét & Ghi sổ</button></div></header>
<main class="wrap"><div class="card"><div class="toolbar"><div><h1>Văn bản đến</h1><div id="orgName" class="small">Đang tải không gian làm việc…</div></div><div><button class="btn" onclick="exportCsv()">↓ Xuất CSV</button> <button class="btn" onclick="load()">↻ Làm mới</button></div></div><div class="stats"><div class="metric"><b id="count">0</b><span>Tổng hồ sơ</span></div><div class="metric"><b id="urgent">0</b><span>Khẩn/Hỏa tốc</span></div><div class="metric"><b id="open">0</b><span>Đang xử lý</span></div></div><div class="toolbar"><div class="left"><input id="q" class="field search" placeholder="Tìm số/ký hiệu, trích yếu, cơ quan ban hành…" oninput="render()"><select id="status" class="field" onchange="render()"><option value="">Tất cả trạng thái</option><option value="received">Đã tiếp nhận</option><option value="assigned">Đã giao</option><option value="processing">Đang xử lý</option><option value="submitted">Trình duyệt</option><option value="approved">Đã duyệt</option><option value="closed">Đã đóng</option><option value="archived">Lưu trữ</option></select><select id="year" class="field" onchange="render()"><option value="">Tất cả năm</option></select></div></div><div id="table" class="empty">Đang tải…</div></div></main>
<script>
const token=localStorage.getItem('hv_vbai_token');if(!token)location.replace('/');const $=x=>document.getElementById(x);let rows=[],org='';const labels={received:'Đã tiếp nhận',assigned:'Đã giao',processing:'Đang xử lý',submitted:'Trình duyệt',approved:'Đã duyệt',rejected:'Từ chối',closed:'Đã đóng',archived:'Lưu trữ',draft:'Dự thảo'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u){let r=await fetch(u,{headers:{Authorization:'Bearer '+token}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}
function fmtDate(s){if(!s)return'—';let d=new Date(s);return isNaN(d)?esc(s):d.toLocaleDateString('vi-VN')}
async function load(){try{let me=await api('/api/v2/me');org=localStorage.getItem('hv_vbai_active_org')||'';let active=(me.memberships||[]).filter(x=>x.status==='active'),mem=active.find(x=>x.organization_id===org);if(!mem){mem=active.find(x=>x.workspace_type==='personal')||active[0];org=mem?.organization_id||'';if(org)localStorage.setItem('hv_vbai_active_org',org)}if(!org||!mem){$('table').innerHTML='<div class="empty">Chưa có không gian làm việc khả dụng.</div>';return}$('orgName').textContent=mem.organization_name;let j=await api(`/api/v2/organizations/${org}/documents?direction=incoming&limit=500`);rows=j.documents||[];let yrs=[...new Set(rows.map(x=>x.register_year).filter(Boolean))].sort((a,b)=>b-a);$('year').innerHTML='<option value="">Tất cả năm</option>'+yrs.map(y=>`<option>${y}</option>`).join('');render()}catch(e){$('table').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function filtered(){let q=$('q').value.trim().toLowerCase(),st=$('status').value,yr=$('year').value;return rows.filter(x=>{let m=x.metadata||{};let hay=[x.source_number,x.symbol,x.sender,x.subject,m.signer_name,m.document_date].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!st||x.status===st)&&(!yr||String(x.register_year)===yr)})}
function render(){let a=filtered();$('count').textContent=rows.length;$('urgent').textContent=rows.filter(x=>x.priority!=='normal').length;$('open').textContent=rows.filter(x=>!['closed','archived'].includes(x.status)).length;if(!a.length){$('table').innerHTML='<div class="empty">Không có văn bản phù hợp.</div>';return}$('table').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Số tiếp nhận</th><th>Ngày nhận</th><th>Số / Ký hiệu</th><th>Ngày ban hành</th><th>Loại</th><th>Cơ quan ban hành</th><th>Trích yếu</th><th>Khẩn</th><th>Hạn xử lý</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${a.map(x=>{let m=x.metadata||{};return`<tr><td><b>#${x.intake_number||'—'}</b><div class="small">${x.register_year||''}</div></td><td>${fmtDate(x.received_at||x.created_at)}</td><td><b>${esc(x.source_number||x.symbol||'—')}</b></td><td>${esc(m.document_date||'—')}</td><td>${esc(m.document_type_name||x.document_type||'—')}</td><td>${esc(x.sender||'—')}</td><td style="max-width:360px">${esc(x.subject)}</td><td class="${x.priority==='normal'?'':'urgent'}">${x.priority==='very_urgent'?'Hỏa tốc':x.priority==='urgent'?'Khẩn':'Bình thường'}</td><td>${esc(x.deadline||'—')}</td><td><span class="badge">${esc(labels[x.status]||x.status)}</span></td><td><button class="btn" onclick="slip('${x.id}')">🖨 Phiếu trình</button></td></tr>`}).join('')}</tbody></table></div>`}
function slip(id){location.href=`/processing-slip?org=${encodeURIComponent(org)}&doc=${encodeURIComponent(id)}`}
function exportCsv(){let a=filtered(),heads=['Số tiếp nhận','Năm','Ngày nhận','Số/Ký hiệu','Ngày ban hành','Cơ quan ban hành','Trích yếu','Mức độ khẩn','Hạn xử lý','Trạng thái'];let data=[heads,...a.map(x=>{let m=x.metadata||{};return[x.intake_number||'',x.register_year||'',x.received_at||'',x.source_number||x.symbol||'',m.document_date||'',x.sender||'',x.subject||'',x.priority||'',x.deadline||'',labels[x.status]||x.status]})];let csv='\ufeff'+data.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),ael=document.createElement('a');ael.href=u;ael.download='so-van-ban-den.csv';ael.click();URL.revokeObjectURL(u)}
load();
</script></body></html>
