<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="/manifest.webmanifest">
<title>Huyền Vũ AI Word V10</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#0f172a;color:#fff;position:sticky;top:0;z-index:5}.brand{font-weight:800}.pill{font-size:12px;background:#1e293b;padding:5px 9px;border-radius:999px}main{max-width:1500px;margin:auto;padding:14px}.toolbar,.subbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}button,select,input{border:1px solid #cbd5e1;border-radius:8px;padding:9px 11px;background:white}button{cursor:pointer;font-weight:650}button.primary{background:#0f172a;color:white;border-color:#0f172a}button.good{background:#166534;color:white;border-color:#166534}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:14px}.card{background:white;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 2px #0000000a}.editor-head,.panel-head{padding:10px 12px;border-bottom:1px solid #e2e8f0;display:flex;gap:8px;align-items:center}.editor-head input{flex:1;font-size:16px;font-weight:700}textarea{width:100%;height:68vh;resize:vertical;border:0;outline:0;padding:24px 32px;font:16px/1.65 'Times New Roman',serif}.panel{padding:12px;max-height:78vh;overflow:auto}.item{padding:10px;border:1px solid #e2e8f0;border-radius:9px;margin:8px 0}.bad{border-left:4px solid #dc2626}.warn{border-left:4px solid #d97706}.ok{border-left:4px solid #16a34a}.muted{color:#64748b;font-size:13px}.status{margin-left:auto;font-size:12px}.tabs{display:flex;gap:6px;overflow:auto}.tab.active{background:#e2e8f0}.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.result-title{font-weight:700}.small{font-size:12px;padding:6px 8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{max-height:none}textarea{height:58vh}}
</style>
</head>
<body>
<header><div class="brand">Huyền Vũ AI Word</div><div class="pill">V10 • GitHub-first</div><div class="status" id="net">● Online</div></header>
<main>
<div class="toolbar">
<select id="template"><option value="">Mẫu trống</option></select>
<select id="mode"><option value="general">Thông thường</option><option value="academic">Học thuật</option><option value="medical">Y khoa</option><option value="research">Nghiên cứu</option></select>
<button onclick="reviewDoc()">🔎 Review V3</button><button onclick="applySafe()">✓ Sửa an toàn</button>
<button onclick="findEvidence()">📚 PubMed/Crossref</button><button onclick="toggleVoice()" id="voiceBtn">🎙 Đọc chính tả</button>
<button onclick="saveGitHub()">☁ Lưu GitHub</button><button onclick="createReviewPR()">⑂ Tạo PR review</button>
<button class="good" onclick="finalizeDoc()">⚡ Finalize V10</button>
</div>
<div class="layout">
<section class="card"><div class="editor-head"><input id="title" value="Văn bản mới"><span class="muted" id="wordCount">0 từ</span></div><textarea id="doc" placeholder="Bắt đầu soạn thảo..."></textarea></section>
<aside class="card"><div class="panel-head"><div class="tabs"><button class="tab active" data-tab="review" onclick="showTab('review')">Review</button><button class="tab" data-tab="research" onclick="showTab('research')">Research</button><button class="tab" data-tab="history" onclick="showTab('history')">GitHub</button></div></div><div class="panel" id="panel"><div id="reviewTab"><div class="muted">Chọn Review để kiểm tra chính tả, thuật ngữ, overclaim, viết tắt và claim thiếu nguồn.</div></div><div id="researchTab" class="hidden"><div class="row"><input id="query" style="flex:1" placeholder="Từ khóa PubMed/Crossref"><button onclick="researchSearch()">Tìm</button></div><div id="researchResults"></div></div><div id="historyTab" class="hidden"><div class="muted">Tài liệu và phiên bản được commit qua GitHub. Offline chỉ giữ hàng chờ tạm trên thiết bị và đồng bộ khi có mạng.</div><div id="gitStatus"></div></div></div></aside>
</div>
</main>
<script>
const $=id=>document.getElementById(id); let lastReview=null,lastResearch=[],activePR=null; let recognition=null,voiceOn=false;
function authHeaders(){const t=localStorage.getItem('hv_vbai_token');return t?{Authorization:'Bearer '+t}:{} }
async function api(url,body){const r=await fetch(url,{method:body===undefined?'GET':'POST',headers:{...authHeaders(),'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showTab(name){['review','research','history'].forEach(x=>{$(x+'Tab').classList.toggle('hidden',x!==name);document.querySelector(`[data-tab="${x}"]`).classList.toggle('active',x===name)})}
function persistDraft(){localStorage.setItem('hv_v10_draft',JSON.stringify({title:$('title').value,mode:$('mode').value,text:$('doc').value,updated_at:new Date().toISOString()}))}
function restoreDraft(){try{const x=JSON.parse(localStorage.getItem('hv_v10_draft')||'null');if(x){$('title').value=x.title||'Văn bản mới';$('mode').value=x.mode||'general';$('doc').value=x.text||''}}catch(e){}}
$('doc').addEventListener('input',()=>{$('wordCount').textContent=($('doc').value.trim().match(/\S+/g)||[]).length+' từ';persistDraft()});$('title').addEventListener('input',persistDraft);$('mode').addEventListener('change',persistDraft);
async function loadTemplates(){try{const j=await api('/api/v5/templates');j.templates.forEach(t=>{$('template').insertAdjacentHTML('beforeend',`<option value="${t.id}">${escapeHtml(t.name)}</option>`)});}catch(e){}}
$('template').addEventListener('change',async()=>{if(!$('template').value)return;try{const j=await api('/api/v5/templates/build',{template_id:$('template').value,data:{title:$('title').value}});$('doc').value=j.spec.blocks.map(b=>b.type==='heading'?'# '+b.text:b.text).join('\n\n');$('doc').dispatchEvent(new Event('input'))}catch(e){alert(e.message)}});
function renderReview(r){lastReview=r;let h=`<div class="item ok"><b>Document Health: ${r.score}/100</b><div class="muted">${r.stats.words} từ • ${r.stats.suggestions} đề xuất • ${r.stats.claims} claim cần nguồn</div></div>`;r.suggestions.forEach(s=>h+=`<div class="item ${s.severity==='high'?'bad':'warn'}"><b>${escapeHtml(s.category)}</b>: <del>${escapeHtml(s.original)}</del>${s.replacement?` → <ins>${escapeHtml(s.replacement)}</ins>`:''}<div class="muted">${escapeHtml(s.reason)}</div><button class="small" data-id="${s.id}" onclick="applyOne(this.dataset.id)">✓ Accept</button> <button class="small" onclick="this.closest('.item').remove()">✕ Reject</button></div>`);r.claims_needing_citation.forEach(c=>h+=`<div class="item warn"><b>⚠ Claim cần citation</b><div>${escapeHtml(c.text)}</div><button class="small" data-claim="${encodeURIComponent(c.text)}" onclick="searchClaim(decodeURIComponent(this.dataset.claim))">Tìm nguồn</button></div>`);if(r.undefined_abbreviations.length)h+=`<div class="item warn"><b>Viết tắt chưa định nghĩa:</b> ${r.undefined_abbreviations.join(', ')}</div>`;$('reviewTab').innerHTML=h;showTab('review')}
async function reviewDoc(){try{const j=await api('/api/v3/review',{text:$('doc').value,mode:$('mode').value});renderReview(j.review)}catch(e){alert(e.message)}}
async function applySafe(){if(!lastReview)await reviewDoc();if(!lastReview)return;try{const j=await api('/api/v3/review/apply',{text:$('doc').value,suggestions:lastReview.suggestions,safe_only:true});$('doc').value=j.text;$('doc').dispatchEvent(new Event('input'));await reviewDoc()}catch(e){alert(e.message)}}
async function applyOne(id){if(!lastReview)return;try{const j=await api('/api/v3/review/apply',{text:$('doc').value,suggestions:lastReview.suggestions,accepted_ids:[id]});$('doc').value=j.text;$('doc').dispatchEvent(new Event('input'));await reviewDoc()}catch(e){alert(e.message)}}
function findEvidence(){showTab('research');$('query').value=$('doc').value.slice(0,180).replace(/\n/g,' ')}
async function searchClaim(text){showTab('research');$('query').value=text.slice(0,220);await researchSearch()}
async function researchSearch(){const q=$('query').value.trim();if(!q)return;try{const j=await api('/api/v6/research/search',{query:q,limit:5});lastResearch=j.results;let h='';j.results.forEach((x,i)=>h+=`<div class="item"><div class="result-title">${escapeHtml(x.title)}</div><div class="muted">${escapeHtml(x.journal)} • ${escapeHtml(x.year)} • ${x.pmid?'PMID '+x.pmid:''} ${x.doi?'DOI '+x.doi:''}</div><button class="small" onclick="insertCitation(${i})">Chèn citation</button></div>`);if(j.results.length)h+='<button class="primary" onclick="insertEvidenceTable()">Chèn Evidence Table</button>';$('researchResults').innerHTML=h||'<div class="muted">Không có kết quả.</div>'}catch(e){$('researchResults').innerHTML='<div class="item bad">'+escapeHtml(e.message)+'</div>'}}
function insertCitation(i){const x=lastResearch[i];const id=x.pmid?`PMID:${x.pmid}`:(x.doi?`DOI:${x.doi}`:'Nguồn');const t=$('doc');const p=t.selectionStart;t.value=t.value.slice(0,p)+` [${id}]`+t.value.slice(p);t.dispatchEvent(new Event('input'))}
async function insertEvidenceTable(){try{const j=await api('/api/v6/research/table',{items:lastResearch});const t=$('doc'),p=t.selectionStart,chunk='\n\n## Evidence Table\n\n'+j.markdown+'\n';t.value=t.value.slice(0,p)+chunk+t.value.slice(p);t.dispatchEvent(new Event('input'))}catch(e){alert(e.message)}}
function docId(){return ($('title').value||'untitled').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'untitled'}
async function saveGitHub(){const payload={document_id:docId(),text:$('doc').value,metadata:{title:$('title').value,mode:$('mode').value,updated_at:new Date().toISOString()}};if(!navigator.onLine){queueOffline(payload);$('gitStatus').innerHTML='<div class="item warn">Đã xếp hàng offline; sẽ đồng bộ GitHub khi có mạng.</div>';showTab('history');return}try{const j=await api('/api/v7/documents/save',payload);$('gitStatus').innerHTML=`<div class="item ok">Đã commit GitHub<br><span class="muted">${escapeHtml(j.saved.repo)} • ${escapeHtml(j.saved.branch)} • ${escapeHtml(j.saved.commit||'')}</span></div>`;showTab('history')}catch(e){queueOffline(payload);alert(e.message)}}
async function createReviewPR(){try{const j=await api('/api/v7/collaboration/pr',{name:docId()+'-'+Date.now(),title:'Review: '+$('title').value,text:$('doc').value,path:'reviews/'+docId()+'.md'});activePR=j.pull_request.number;$('gitStatus').innerHTML=`<div class="item ok">PR #${j.pull_request.number} đã tạo: <a target="_blank" href="${j.pull_request.url}">mở GitHub</a><div><button class="small" onclick="commentPR()">Comment</button> <button class="small" onclick="reviewPR('APPROVE')">Approve</button> <button class="small" onclick="reviewPR('REQUEST_CHANGES')">Request changes</button></div></div>`;showTab('history')}catch(e){alert(e.message)}}
async function commentPR(){if(!activePR)return;const comment=prompt('Nhập comment review');if(!comment)return;try{await api('/api/v7/collaboration/comment',{pr_number:activePR,comment});alert('Đã gửi comment lên GitHub')}catch(e){alert(e.message)}}
async function reviewPR(event){if(!activePR)return;const body=prompt(event==='APPROVE'?'Ghi chú phê duyệt':'Nội dung yêu cầu chỉnh sửa')||'';try{await api('/api/v7/collaboration/review',{pr_number:activePR,event,body});alert('Đã gửi review lên GitHub')}catch(e){alert(e.message)}}
function queueOffline(payload){localStorage.setItem('hv_v10_offline_queue',JSON.stringify(payload))}
async function syncQueued(){if(!navigator.onLine)return;const raw=localStorage.getItem('hv_v10_offline_queue');if(!raw)return;try{await api('/api/v7/documents/save',JSON.parse(raw));localStorage.removeItem('hv_v10_offline_queue');$('gitStatus').innerHTML='<div class="item ok">Hàng chờ offline đã đồng bộ GitHub.</div>'}catch(e){}}
window.addEventListener('online',()=>{$('net').textContent='● Online';syncQueued()});window.addEventListener('offline',()=>{$('net').textContent='● Offline'});
function setupVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return false;recognition=new SR();recognition.lang='vi-VN';recognition.continuous=true;recognition.interimResults=false;recognition.onresult=async ev=>{let raw='';for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)raw+=ev.results[i][0].transcript+' ';try{const j=await api('/api/v9/voice/normalize',{text:raw});$('doc').value+=($('doc').value?' ':'')+j.text}catch(e){$('doc').value+=raw}$('doc').dispatchEvent(new Event('input'))};recognition.onend=()=>{if(voiceOn)recognition.start()};return true}
function toggleVoice(){if(!recognition&&!setupVoice()){alert('Trình duyệt chưa hỗ trợ Web Speech API.');return}voiceOn=!voiceOn;$('voiceBtn').textContent=voiceOn?'⏹ Dừng đọc':'🎙 Đọc chính tả';if(voiceOn)recognition.start();else recognition.stop()}
function b64blob(b64,type){const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type})}
async function finalizeDoc(){try{const j=await api('/api/v10/finalize',{title:$('title').value,text:$('doc').value,mode:$('mode').value,auto_fix_safe:true,verify_citations:true});$('doc').value=j.text;$('doc').dispatchEvent(new Event('input'));renderReview(j.review);const c=j.citation_checks||{checked:0,valid:0};$('reviewTab').insertAdjacentHTML('afterbegin',`<div class="item ${c.checked===c.valid?'ok':'warn'}"><b>Citation verification:</b> ${c.valid}/${c.checked} DOI/PMID hợp lệ</div>`);const blob=b64blob(j.docx_base64,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=docId()+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);const w=window.open('','_blank');if(w){w.document.open();w.document.write(j.print_html);w.document.close()}else alert('DOCX đã tải. Cho phép popup để lưu PDF qua hộp thoại Print.')}catch(e){alert(e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});restoreDraft();loadTemplates();syncQueued();$('doc').dispatchEvent(new Event('input'));
</script>
</body></html>
