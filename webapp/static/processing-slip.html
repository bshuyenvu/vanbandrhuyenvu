<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiếu trình & Theo dõi xử lý văn bản đến</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:"Segoe UI",Arial,sans-serif}.bar{height:58px;background:#fff;border-bottom:1px solid #dbe3ed;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px}.btn{border:1px solid #d8e0ea;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:#4f32f3;border-color:#4f32f3;color:#fff;font-weight:700}.paper{width:210mm;min-height:297mm;background:#fff;margin:20px auto;padding:16mm 13mm;box-shadow:0 8px 28px #0f172a20}.head{display:grid;grid-template-columns:1fr 1fr;gap:15mm;text-align:center;font-size:11px}.head b{font-size:12px}.line{border-top:1.5px solid #111827;margin:9mm 0 6mm}.title{text-align:center;font-size:18px;font-weight:800}.subtitle{text-align:center;font-size:10px;color:#6b7280;font-style:italic;margin:5px 0 7mm}.info{width:100%;border-collapse:collapse;font-size:11px}.info td{border:1px solid #26374d;padding:7px 8px;vertical-align:top}.info .label{background:#f5f7fa;font-weight:700;width:23%}.urgent{color:#dc2626;font-weight:800}.opinion{height:54mm;border:1px solid #26374d;margin-top:7mm;padding:9px 11px;position:relative;font-size:10px}.opinion b{text-decoration:underline}.dateblank{position:absolute;right:12px;bottom:10px;font-style:italic;color:#374151}.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:9mm;font-size:10px;font-weight:700}.signs .space{height:27mm}.signs em{font-size:9px;color:#6b7280;font-weight:400}.foot{border-top:1px solid #cad3df;margin-top:7mm;padding-top:5px;display:flex;justify-content:space-between;font-size:8px;color:#94a3b8}.loading{text-align:center;padding:50px}@media(max-width:850px){.paper{width:100%;margin:0;box-shadow:none;padding:12mm 8mm}.bar{position:sticky;top:0;z-index:2}}@media print{body{background:#fff}.bar{display:none}.paper{margin:0;box-shadow:none;width:210mm;min-height:297mm;padding:13mm 12mm}@page{size:A4;margin:0}}
</style></head><body><div class="bar"><div>🖨 <b>Xem trước bản in: Phiếu tiếp nhận & Xử lý văn bản</b></div><div><button class="btn" onclick="location.href='/register'">← Sổ điện tử</button> <button class="btn primary" onclick="window.print()">🖨 In Phiếu Ngay</button></div></div><main id="paper" class="paper"><div class="loading">Đang tải hồ sơ…</div></main>
<script>
const token=localStorage.getItem('hv_vbai_token');if(!token)location.replace('/');const qp=new URLSearchParams(location.search),org=qp.get('org'),doc=qp.get('doc'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u){let r=await fetch(u,{headers:{Authorization:'Bearer '+token}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}function dt(s,withTime=false){if(!s)return'—';let d=new Date(s);if(isNaN(d))return esc(s);return d.toLocaleString('vi-VN',withTime?{dateStyle:'short',timeStyle:'short'}:{dateStyle:'short'})}function typeName(id){let m={gov_cong_van:'Công văn',gov_bao_cao:'Báo cáo',gov_to_trinh:'Tờ trình',gov_ke_hoach:'Kế hoạch',gov_quyet_dinh:'Quyết định',gov_thong_bao:'Thông báo',gov_bien_ban:'Biên bản',gov_giay_moi:'Giấy mời',party_cong_van:'Công văn Đảng',party_bao_cao:'Báo cáo Đảng',party_quyet_dinh:'Quyết định Đảng',party_thong_bao:'Thông báo Đảng'};return m[id]||id||'—'}
async function load(){if(!org||!doc){document.getElementById('paper').innerHTML='<div class="loading">Thiếu mã cơ quan hoặc hồ sơ.</div>';return}try{let [me,j]=await Promise.all([api('/api/v2/me'),api(`/api/v2/organizations/${org}/documents/${doc}`)]),d=j.document,m=d.metadata||{},membership=(me.memberships||[]).find(x=>x.organization_id===org),orgName=membership?.organization_name||'CƠ QUAN / ĐƠN VỊ TIẾP NHẬN',asg=(j.assignments||[])[0],urg=d.priority==='very_urgent'?'Hỏa tốc':d.priority==='urgent'?'Khẩn':'Bình thường',received=d.received_at||d.created_at,signer=[m.signer_name,m.signer_title].filter(Boolean).join(' - ')||'—',task=m.task_summary||((m.requests||[]).map(x=>x.request).join('; '))||'—';document.getElementById('paper').innerHTML=`<div class="head"><div>CƠ QUAN / ĐƠN VỊ TIẾP NHẬN<br><b>${esc(orgName.toUpperCase())}</b><br><span style="color:#64748b">Số tiếp nhận: #${esc(d.intake_number||'—')}</span></div><div><b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br>Độc lập - Tự do - Hạnh phúc<br><i style="color:#64748b">Tiếp nhận ngày: ${dt(received,true)}</i></div></div><div class="line"></div><div class="title">PHIẾU TRÌNH & THEO DÕI XỬ LÝ VĂN BẢN ĐẾN</div><div class="subtitle">(Trích xuất tự động qua Cổng số hóa văn bản tích hợp AI — cần cán bộ kiểm tra bản gốc)</div><table class="info"><tr><td class="label">Số / Ký hiệu:</td><td><b>${esc(d.source_number||d.symbol||'—')}</b></td><td class="label">Ngày ban hành:</td><td>${esc(m.document_date||'—')}</td></tr><tr><td class="label">Loại văn bản:</td><td>${esc(m.document_type_name||typeName(d.document_type))}</td><td class="label">Mức độ khẩn:</td><td class="${d.priority==='normal'?'':'urgent'}">${urg}</td></tr><tr><td class="label">Cơ quan ban hành:</td><td colspan="3"><b>${esc(d.sender||'—')}</b></td></tr><tr><td class="label">Người ký / Chức vụ:</td><td colspan="3">${esc(signer)}</td></tr><tr><td class="label">Trích yếu nội dung:</td><td colspan="3">${esc(d.subject||'—')}</td></tr><tr><td class="label">Tóm tắt nhiệm vụ:</td><td colspan="3" style="white-space:pre-line">${esc(task)}</td></tr><tr><td class="label">Đơn vị tiếp nhận xử lý:</td><td>${esc(asg?.department_name||'Chưa phân công')}</td><td class="label">Hạn hoàn thành:</td><td><b>${esc(d.deadline||'—')}</b></td></tr></table><div class="opinion"><b>Ý KIẾN CHỈ ĐẠO CỦA LÃNH ĐẠO CƠ QUAN / ĐƠN VỊ:</b><div class="dateblank">Ngày ..... tháng ..... năm 20....</div></div><div class="signs"><div>CÁN BỘ VĂN THƯ<div class="space"></div><em>(Ký, ghi rõ họ tên)</em></div><div>LÃNH ĐẠO PHÊ DUYỆT<div class="space"></div><em>(Ký, ghi rõ họ tên)</em></div><div>NGƯỜI NHẬN XỬ LÝ<div class="space"></div><em>(Ký, ngày nhận)</em></div></div><div class="foot"><span>Tệp hồ sơ: ${(j.attachments||[]).map(x=>esc(x.original_name)).join(', ')||'Chưa có'}</span><span>Mã định danh hệ thống: ${esc(doc)}</span></div>`}catch(e){document.getElementById('paper').innerHTML=`<div class="loading">${esc(e.message)}</div>`}}load();
</script></body></html>
