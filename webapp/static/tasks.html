<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Công việc & Hạn xử lý • Huyền Vũ Văn Bản AI</title>
<style>
:root{--red:#a51f2d;--navy:#17263b;--bg:#f2f5f8;--line:#dfe5ec;--muted:#6e7c8f;--green:#17724d;--amber:#a26307;--blue:#3156a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand b{color:var(--red);font-size:18px}.brand small{display:block;color:var(--muted);margin-top:2px}.wrap{max-width:1450px;margin:auto;padding:22px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 22px #17263b0a}.hero{padding:20px}.row,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:28px;margin:2px 0 5px}h2{font-size:17px;margin:0}.sub,.small{font-size:12px;color:var(--muted);line-height:1.5}.btn,.field{border:1px solid #d5dde7;background:#fff;border-radius:8px;padding:9px 11px;color:#26364b}.btn{cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.ok{background:var(--green);border-color:var(--green);color:#fff}.btn.warn{background:#fff7df;border-color:#ead6a5;color:#75510a}.field{min-width:180px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}.metric{padding:13px;border:1px solid #edf0f4;border-radius:10px;background:#fafbfd}.metric b{display:block;font-size:25px}.metric span{font-size:10px;color:var(--muted)}.metric.danger b{color:var(--red)}.metric.warning b{color:var(--amber)}.card{margin-top:14px;padding:17px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 11px;cursor:pointer;font-size:11px}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px;min-width:1050px}.table th,.table td{padding:10px 9px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}.table th{font-size:10px;color:#68788d;background:#fafbfd}.badge{display:inline-block;border-radius:14px;padding:4px 7px;background:#edf2f6;font-size:10px}.badge.red{background:#ffe7e9;color:#a51f2d}.badge.warn{background:#fff3d5;color:#8b5b08}.badge.ok{background:#e6f5ed;color:#17724d}.badge.blue{background:#eaf0ff;color:#3156a3}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;padding:38px;color:#8794a5}.notice{padding:10px 12px;border:1px solid #ecdcae;background:#fff8e6;border-radius:8px;font-size:12px}.notice.red{background:#fff0f1;border-color:#efc4ca;color:#982633}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.wrap{padding:12px}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.top{padding:0 10px}.brand small{display:none}}
</style></head><body>
<header class="top"><div class="brand"><b>HUYỀN VŨ VĂN BẢN AI</b><small>Công việc • Trình duyệt • Hạn xử lý</small></div><div><button class="btn" onclick="location.href='/'">← Tổng quan</button> <button class="btn" onclick="location.href='/digitize'">✦ Tiếp nhận</button></div></header>
<main class="wrap"><section class="hero"><div class="row"><div><div class="small">ĐIỀU HÀNH CÔNG VIỆC</div><h1>Công việc & hạn xử lý</h1><div id="scope" class="sub">Đang tải không gian làm việc…</div></div><select id="org" class="field" onchange="switchWorkspace()"></select></div><div class="stats"><div class="metric"><b id="mAssign">0</b><span>CHỜ GIAO</span></div><div class="metric"><b id="mDoing">0</b><span>ĐANG XỬ LÝ</span></div><div class="metric"><b id="mApprove">0</b><span>CHỜ DUYỆT</span></div><div class="metric"><b id="mIssue">0</b><span>CHỜ PHÁT HÀNH</span></div><div class="metric warning"><b id="mSoon">0</b><span>SẮP ĐẾN HẠN</span></div><div class="metric danger"><b id="mOverdue">0</b><span>QUÁ HẠN</span></div></div></section>
<section class="card"><div class="toolbar"><div class="tabs" id="tabs"><button class="tab on" data-filter="active">Đang cần xử lý</button><button class="tab" data-filter="cho_giao">Chờ giao</button><button class="tab" data-filter="dang_xu_ly">Đang xử lý</button><button class="tab" data-filter="cho_duyet">Chờ duyệt</button><button class="tab" data-filter="cho_phat_hanh">Chờ phát hành</button><button class="tab" data-filter="hoan_tat">Hoàn tất</button></div><div><select id="deadlineFilter" class="field" onchange="render()"><option value="">Tất cả hạn</option><option value="qua_han">Quá hạn</option><option value="sap_han_24h">Còn ≤ 24 giờ</option><option value="sap_han_48h">Còn ≤ 48 giờ</option><option value="binh_thuong">Còn trên 48 giờ</option></select> <input id="q" class="field" placeholder="Tìm số, trích yếu, đơn vị…" oninput="render()"></div></div><div id="alertBox"></div><div id="table" class="empty">Đang tải công việc…</div></section></main>
<script>
const T='hv_vbai_token',token=localStorage.getItem(T);if(!token)location.replace('/');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const STATUS={draft:'Dự thảo',received:'Đã tiếp nhận',assigned:'Đã giao',processing:'Đang xử lý',submitted:'Đã trình duyệt',approved:'Đã duyệt',rejected:'Yêu cầu sửa',issued:'Đã phát hành',closed:'Đã đóng',archived:'Lưu trữ',cancelled:'Đã hủy'};
const ROLE={organization_owner:'Chủ sở hữu',organization_admin:'Quản trị cơ quan',records_clerk:'Văn thư',leader:'Lãnh đạo',department_head:'Trưởng phòng/khoa',member:'Chuyên viên',billing_admin:'Quản lý thanh toán',auditor:'Kiểm tra viên',viewer:'Chỉ xem'};
let me=null,data=null,filter='active';
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};let r=await fetch(path,opt),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j}
function membership(){return (me?.memberships||[]).find(x=>x.organization_id===$('org').value)}
function deadlineLabel(i){let s=i.deadline_state;if(s==='qua_han')return`<span class="badge red">Quá hạn ${Math.abs(i.hours_remaining||0)} giờ</span>`;if(s==='sap_han_24h')return`<span class="badge red">Còn ${Math.max(0,i.hours_remaining||0)} giờ</span>`;if(s==='sap_han_48h')return`<span class="badge warn">Còn ${Math.max(0,i.hours_remaining||0)} giờ</span>`;if(i.deadline)return`<span class="badge blue">${new Date(i.deadline).toLocaleString('vi-VN')}</span>`;return'<span class="small">Chưa đặt hạn</span>'}
function statusBadge(i){let c=i.status==='approved'||i.status==='issued'||i.status==='closed'?'ok':i.status==='rejected'?'red':i.status==='submitted'?'warn':'';return`<span class="badge ${c}">${esc(STATUS[i.status]||i.status)}</span>`}
function can(role,names){return names.includes(role)}
function actionButtons(i){let role=membership()?.role||'',a=[];if(['assigned','received'].includes(i.status)&&can(role,['organization_owner','organization_admin','records_clerk','department_head','member']))a.push(`<button class="btn" onclick="move('${i.id}','processing')">Bắt đầu xử lý</button>`);if(['processing','rejected'].includes(i.status)&&can(role,['organization_owner','organization_admin','records_clerk','department_head','member']))a.push(`<button class="btn primary" onclick="move('${i.id}','submitted')">Trình duyệt</button>`);if(i.status==='submitted'&&can(role,['organization_owner','organization_admin','leader'])){a.push(`<button class="btn ok" onclick="move('${i.id}','approved')">Duyệt</button>`);a.push(`<button class="btn warn" onclick="move('${i.id}','rejected')">Yêu cầu sửa</button>`)}if(i.status==='approved'&&can(role,['organization_owner','organization_admin','records_clerk']))a.push(`<button class="btn ok" onclick="move('${i.id}','issued')">Phát hành</button>`);a.push(`<button class="btn" onclick="openSlip('${i.id}')">Phiếu trình</button>`);return`<div class="actions">${a.join('')}</div>`}
function setMetrics(){let c=data?.counts||{},a=data?.alerts||{};$('mAssign').textContent=c.cho_giao||0;$('mDoing').textContent=c.dang_xu_ly||0;$('mApprove').textContent=c.cho_duyet||0;$('mIssue').textContent=c.cho_phat_hanh||0;$('mSoon').textContent=(a.sap_han_24h||0)+(a.sap_han_48h||0);$('mOverdue').textContent=a.qua_han||0;let total=(a.qua_han||0)+(a.sap_han_24h||0)+(a.sap_han_48h||0);$('alertBox').innerHTML=total?`<div class="notice ${a.qua_han?'red':''}"><b>${a.qua_han?`${a.qua_han} công việc đã quá hạn.`:'Có công việc sắp đến hạn.'}</b> ${a.sap_han_24h||0} việc còn ≤24 giờ, ${a.sap_han_48h||0} việc còn ≤48 giờ.</div>`:'<div class="notice">Không có công việc sắp hạn hoặc quá hạn trong danh sách bạn được quyền xử lý.</div>'}
function filteredItems(){let rows=data?.items||[],d=$('deadlineFilter').value,q=$('q').value.trim().toLowerCase();if(filter==='active')rows=rows.filter(i=>i.bucket!=='hoan_tat');else rows=rows.filter(i=>i.bucket===filter);if(d)rows=rows.filter(i=>i.deadline_state===d);if(q)rows=rows.filter(i=>[i.subject,i.source_number,i.register_number,i.sender,i.recipient,i.department_name,i.assignee_name].some(x=>String(x||'').toLowerCase().includes(q)));return rows}
function render(){setMetrics();let rows=filteredItems();if(!rows.length){$('table').innerHTML='<div class="empty">Không có công việc phù hợp.</div>';return}$('table').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Số / hồ sơ</th><th>Trích yếu</th><th>Đơn vị xử lý</th><th>Hạn xử lý</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${rows.map(i=>`<tr><td><b>${esc(i.source_number||i.register_number||'—')}</b><div class="small">${i.intake_number?'Tiếp nhận #'+i.intake_number+' / '+(i.register_year||''):''}</div></td><td><b>${esc(i.subject||'')}</b><div class="small">${esc(i.direction==='incoming'?(i.sender||'Văn bản đến'):(i.recipient||'Văn bản đi'))}</div></td><td>${esc(i.department_name||'Chưa giao đơn vị')}<div class="small">${esc(i.assignee_name||'')}</div></td><td>${deadlineLabel(i)}</td><td>${statusBadge(i)}</td><td>${actionButtons(i)}</td></tr>`).join('')}</tbody></table></div>`}
async function loadQueue(){let id=$('org').value;if(!id)return;try{data=await api(`/api/v2/organizations/${id}/work-queue`);let m=membership();$('scope').textContent=`${m?.organization_name||'Không gian làm việc'} • ${ROLE[m?.role]||m?.role||''}`;render()}catch(e){$('table').innerHTML=`<div class="notice red">${esc(e.message)}</div>`}}
async function switchWorkspace(){localStorage.setItem('hv_vbai_active_org',$('org').value);await loadQueue()}
function openSlip(id){location.href=`/processing-slip?org=${encodeURIComponent($('org').value)}&doc=${encodeURIComponent(id)}`}
async function move(id,status){let note=prompt('Ghi chú xử lý (có thể để trống):','')||'';try{await api(`/api/v2/organizations/${$('org').value}/documents/${id}/status`,{method:'PATCH',body:JSON.stringify({status,note})});await loadQueue()}catch(e){alert(e.message)}}
async function init(){try{me=await api('/api/v2/me');let ms=(me.memberships||[]).filter(x=>x.status==='active');$('org').innerHTML=ms.map(x=>`<option value="${esc(x.organization_id)}">${x.workspace_type==='personal'?'👤':'🏢'} ${esc(x.organization_name)}</option>`).join('');let saved=localStorage.getItem('hv_vbai_active_org'),pick=ms.find(x=>x.organization_id===saved)||ms.find(x=>x.workspace_type==='personal')||ms[0];if(pick)$('org').value=pick.organization_id;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});await loadQueue()}catch(e){$('table').innerHTML=`<div class="notice red">${esc(e.message)}</div>`}}
init();
</script></body></html>
